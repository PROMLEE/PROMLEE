name: generate animation
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: PROMLEE
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF0000&color_dots=#e5e5e5,#BFBFFF,#8080FF,#4040FF,#0000FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FF0000&color_dots=#666666,#BFBFFF,#8080FF,#4040FF,#0000FF

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
